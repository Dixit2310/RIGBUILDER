{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password - RIGBUILDER{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="col-md-5 mx-auto text-center">
        <div class="glass-panel p-5 border border-secondary-subtle">
            <i class="fa-solid fa-key text-gradient fs-1 mb-3"></i>
            <h3 class="fw-bold text-light">Forgot Password</h3>
            <p class="text-secondary small mb-4">Input your email address and we'll send a password recovery OTP code.</p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="email" name="email" class="form-control bg-dark border-secondary text-light text-center rounded-pill" placeholder="email@example.com" required>
                </div>
                <button type="submit" class="btn btn-premium w-100 py-2 rounded-pill">Get Reset OTP</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
