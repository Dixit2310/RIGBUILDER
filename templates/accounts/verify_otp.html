{% extends 'base.html' %}
{% load static %}

{% block title %}Verify OTP - RIGBUILDER{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="col-md-5 mx-auto text-center">
        <div class="glass-panel p-5 border border-secondary-subtle">
            <i class="fa-solid fa-envelope-open-text text-gradient fs-1 mb-3"></i>
            <h3 class="fw-bold text-light">Verify Account</h3>
            <p class="text-secondary small mb-4">Please input the 6-digit confirmation code generated in your console output log for email: <b>{{ user.email }}</b></p>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <input type="text" name="otp" class="form-control form-control-lg bg-dark border-secondary text-light fw-bold text-center tracking-widest rounded-pill" placeholder="000000" maxlength="6" required>
                </div>
                <button type="submit" class="btn btn-premium w-100 py-2 rounded-pill">Confirm Code</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
