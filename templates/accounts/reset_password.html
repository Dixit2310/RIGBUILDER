{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - RIGBUILDER{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="col-md-5 mx-auto">
        <div class="glass-panel p-5 border border-secondary-subtle">
            <div class="text-center mb-4">
                <i class="fa-solid fa-lock-open text-gradient fs-1 mb-2"></i>
                <h3 class="fw-bold text-light">Reset Password</h3>
                <p class="text-secondary small">Input the OTP code along with your new password.</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small text-secondary">OTP Code</label>
                    <input type="text" name="otp" class="form-control bg-dark border-secondary text-light fw-bold text-center rounded-pill" placeholder="000000" maxlength="6" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary">New Password</label>
                    <input type="password" name="password" class="form-control bg-dark border-secondary text-light rounded-pill" required>
                </div>
                <div class="mb-4">
                    <label class="form-label small text-secondary">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control bg-dark border-secondary text-light rounded-pill" required>
                </div>
                
                <button type="submit" class="btn btn-premium w-100 py-2 rounded-pill">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
